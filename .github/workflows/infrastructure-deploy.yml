# -------------------------------------------------
# Infrastructure CI/CD Pipeline
#
# Triggers on every push to main that changes
# anything under the terraform/ directory.
#
# Steps:
#   1. Checkout code
#   2. Configure AWS credentials
#   3. terraform fmt   — checks formatting
#   4. Ensure state S3 bucket exists (bootstrap)
#   5. terraform init  — downloads providers
#   6. Sanitize and validate secrets used by Terraform
#   7. terraform plan  — shows what will change (PR only)
#   8. terraform apply — applies changes (main branch only)
# -------------------------------------------------

name: Infrastructure Deploy

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET_PREFIX: starttech-terraform-state

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-deploy.yml"
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    outputs:
      frontend_bucket_name: ${{ steps.export_outputs.outputs.frontend_bucket_name }}
      cloudfront_distribution_id: ${{ steps.export_outputs.outputs.cloudfront_distribution_id }}
      backend_url: ${{ steps.export_outputs.outputs.backend_url }}
    defaults:
      run:
        working-directory: terraform # all commands run inside the terraform/ folder

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Authenticate with AWS using GitHub secrets
      # Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in:
      # GitHub repo → Settings → Secrets and variables → Actions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3 — Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Step 4 — Check that all files are properly formatted
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Step 5 — Ensure the remote-state bucket exists (first run bootstrap)
      - name: Ensure Terraform state bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_STATE_BUCKET="${TF_STATE_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $TF_STATE_BUCKET"
          else
            echo "Creating state bucket: $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      # Step 6 — Download providers and configure the S3 backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      # Step 7 — Normalize secret inputs and validate email format
      - name: Prepare Terraform variables
        run: |
          ALERT_EMAIL_CLEAN=$(printf '%s' "${{ secrets.ALERT_EMAIL }}" | tr -d '\r\n' | xargs)

          if ! printf '%s' "$ALERT_EMAIL_CLEAN" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "Invalid ALERT_EMAIL secret value."
            echo "Set ALERT_EMAIL to a plain email address (example: you@example.com), no quotes/spaces/newlines."
            exit 1
          fi

          echo "TF_VAR_ami_id=${{ secrets.AMI_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_docker_image=${{ secrets.DOCKER_IMAGE }}" >> "$GITHUB_ENV"
          echo "TF_VAR_mongo_uri=${{ secrets.MONGO_URI }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_bucket_name=${{ secrets.FRONTEND_BUCKET_NAME }}" >> "$GITHUB_ENV"
          echo "TF_VAR_alert_email=$ALERT_EMAIL_CLEAN" >> "$GITHUB_ENV"

          # Strip any http:// or https:// prefix — CloudFront origin requires bare hostname only
          ALB_DNS_NAME_CLEAN=$(printf '%s' "${{ secrets.ALB_DNS_NAME }}" | tr -d '\r\n' | xargs | sed 's|^https\?://||' | sed 's|/.*$||')
          if [ -z "$ALB_DNS_NAME_CLEAN" ]; then
            ALB_DNS_NAME_CLEAN=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?contains(LoadBalancerName, 'starttech-alb')].DNSName | [0]" \
              --output text | sed 's|^https\?://||' | sed 's|/.*$||')
          fi

          if [ -z "$ALB_DNS_NAME_CLEAN" ] || [ "$ALB_DNS_NAME_CLEAN" = "None" ]; then
            echo "WARNING: ALB DNS could not be resolved. CloudFront /api/* routing may not be created."
            echo "Set ALB_DNS_NAME secret to your current ALB DNS to guarantee API routing via CloudFront."
            ALB_DNS_NAME_CLEAN=""
          fi

          echo "Resolved ALB_DNS_NAME: $ALB_DNS_NAME_CLEAN"
          echo "TF_VAR_alb_dns_name=$ALB_DNS_NAME_CLEAN" >> "$GITHUB_ENV"

      # Step 8 — Validate that the configuration is syntactically correct
      - name: Terraform Validate
        run: terraform validate

      # Step 9 — Show what Terraform will create/change/destroy
      # This step runs on PRs so reviewers can see changes before merge
      # Variables are passed as TF_VAR_* env vars — avoids file quoting issues
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      # Step 10 — Apply changes (only on push to main, not on PRs)
      # After a full teardown, ALB DNS changes. First apply creates ALB,
      # second apply injects fresh ALB DNS into CloudFront /api/* origin.
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          terraform apply -auto-approve

          FRESH_BACKEND_URL=$(terraform output -raw backend_url 2>/dev/null || true)
          FRESH_ALB_DNS=$(printf '%s' "$FRESH_BACKEND_URL" | sed 's|^https\?://||' | sed 's|/.*$||')

          if [ -n "$FRESH_ALB_DNS" ] && [ "$FRESH_ALB_DNS" != "None" ]; then
            echo "Re-applying with fresh ALB DNS for CloudFront API routing: $FRESH_ALB_DNS"
            export TF_VAR_alb_dns_name="$FRESH_ALB_DNS"
            terraform apply -auto-approve
          else
            echo "Could not resolve fresh ALB DNS after first apply; skipping second apply."
          fi

      # Step 11 — Export key Terraform outputs for downstream use (main only)
      - name: Export Terraform outputs
        id: export_outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          FRONTEND_BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          BACKEND_URL=$(terraform output -raw backend_url)

          echo "frontend_bucket_name=$FRONTEND_BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$CLOUDFRONT_DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Terraform Outputs For starttech-application"
            echo ""
            echo "Set these in starttech-application repository secrets:"
            echo ""
            echo "- S3_BUCKET_NAME = $FRONTEND_BUCKET_NAME"
            echo "- CLOUDFRONT_DISTRIBUTION_ID = $CLOUDFRONT_DISTRIBUTION_ID"
            echo "- REACT_APP_API_URL = $BACKEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 12 — Sync infra outputs to starttech-application and starttech-infra secrets
      # Requires a PAT in starttech-infra secrets with write access to both repos' actions secrets.
      # Suggested secret name: APP_REPO_SECRETS_PAT
      - name: Sync outputs to application and infra secrets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_SECRETS_PAT }}
          TARGET_REPO: esodevops/starttech-application
          SOURCE_REPO: esodevops/starttech-infra
          FRONTEND_BUCKET_NAME: ${{ steps.export_outputs.outputs.frontend_bucket_name }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.export_outputs.outputs.cloudfront_distribution_id }}
          REACT_APP_API_URL: ${{ steps.export_outputs.outputs.backend_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing APP_REPO_SECRETS_PAT in starttech-infra repo secrets."
            echo "Add a PAT with write access to Actions secrets on $TARGET_REPO."
            exit 1
          fi

          if [ -z "$FRONTEND_BUCKET_NAME" ] || [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ] || [ -z "$REACT_APP_API_URL" ]; then
            echo "One or more Terraform outputs are empty; refusing to sync incomplete secrets."
            exit 1
          fi

          gh secret set S3_BUCKET_NAME --repo "$TARGET_REPO" --body "$FRONTEND_BUCKET_NAME"
          gh secret set CLOUDFRONT_DISTRIBUTION_ID --repo "$TARGET_REPO" --body "$CLOUDFRONT_DISTRIBUTION_ID"
          gh secret set REACT_APP_API_URL --repo "$TARGET_REPO" --body "$REACT_APP_API_URL"
          gh secret set BACKEND_URL --repo "$SOURCE_REPO" --body "$REACT_APP_API_URL"

          echo "Synced S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID, and REACT_APP_API_URL to $TARGET_REPO"
          echo "Synced BACKEND_URL to $SOURCE_REPO"

      # Step 13 — Add NAT Gateway IP to MongoDB Atlas Access List
      - name: Add NAT Gateway IP to MongoDB Atlas Access List
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          if [ -z "$ATLAS_PUBLIC_KEY" ] || [ -z "$ATLAS_PRIVATE_KEY" ] || [ -z "$ATLAS_PROJECT_ID" ]; then
            echo "Atlas secrets are missing (ATLAS_PUBLIC_KEY / ATLAS_PRIVATE_KEY / ATLAS_PROJECT_ID)."
            exit 1
          fi

          NAT_IP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=starttech-nat-eip" \
            --query "Addresses[0].PublicIp" \
            --output text)

          if [ -z "$NAT_IP" ] || [ "$NAT_IP" = "None" ]; then
            NAT_ALLOC_ID=$(aws ec2 describe-nat-gateways \
              --filter "Name=tag:Name,Values=starttech-nat-gw" "Name=state,Values=available,pending" \
              --query "NatGateways[0].NatGatewayAddresses[0].AllocationId" \
              --output text)

            if [ -n "$NAT_ALLOC_ID" ] && [ "$NAT_ALLOC_ID" != "None" ]; then
              NAT_IP=$(aws ec2 describe-addresses \
                --allocation-ids "$NAT_ALLOC_ID" \
                --query "Addresses[0].PublicIp" \
                --output text)
            fi
          fi

          if [ -z "$NAT_IP" ]; then
            echo "Failed to retrieve NAT Gateway IP."
            exit 1
          fi

          echo "Ensuring NAT Gateway IP $NAT_IP is present in MongoDB Atlas Access List..."

          ACCESS_LIST_JSON=$(curl -sS --digest -u "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" \
            "https://cloud.mongodb.com/api/atlas/v1.0/groups/$ATLAS_PROJECT_ID/accessList")

          if printf '%s' "$ACCESS_LIST_JSON" | grep -q "$NAT_IP"; then
            echo "NAT Gateway IP $NAT_IP already exists in Atlas Access List."
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /tmp/atlas-accesslist-response.json -w "%{http_code}" \
            --digest -u "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "{\"ipAddress\": \"$NAT_IP\", \"comment\": \"NAT Gateway IP\"}" \
            "https://cloud.mongodb.com/api/atlas/v1.0/groups/$ATLAS_PROJECT_ID/accessList"
          )

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "409" ]; then
            echo "Failed to add NAT IP to Atlas Access List (HTTP $HTTP_CODE)."
            cat /tmp/atlas-accesslist-response.json
            exit 1
          fi

          echo "Atlas Access List update completed for NAT IP $NAT_IP (HTTP $HTTP_CODE)."
