# -------------------------------------------------
# Infrastructure CI/CD Pipeline
#
# Triggers on every push to main that changes
# anything under the terraform/ directory.
#
# Steps:
#   1. Checkout code
#   2. Configure AWS credentials
#   3. terraform fmt   — checks formatting
#   4. Ensure state S3 bucket exists (bootstrap)
#   5. terraform init  — downloads providers
#   6. Sanitize and validate secrets used by Terraform
#   7. terraform plan  — shows what will change (PR only)
#   8. terraform apply — applies changes (main branch only)
# -------------------------------------------------

name: Infrastructure Deploy

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET_PREFIX: starttech-terraform-state

on:
  push:
    branches: [ main ]
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-deploy.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-deploy.yml"
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    outputs:
      frontend_bucket_name: ${{ steps.export_outputs.outputs.frontend_bucket_name }}
      cloudfront_distribution_id: ${{ steps.export_outputs.outputs.cloudfront_distribution_id }}
      backend_url: ${{ steps.export_outputs.outputs.backend_url }}
    defaults:
      run:
        working-directory: terraform # all commands run inside the terraform/ folder

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Authenticate with AWS using GitHub secrets
      # Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in:
      # GitHub repo → Settings → Secrets and variables → Actions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3 — Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Step 4 — Check that all files are properly formatted
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Step 5 — Ensure the remote-state bucket exists (first run bootstrap)
      - name: Ensure Terraform state bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_STATE_BUCKET="${TF_STATE_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $TF_STATE_BUCKET"
          else
            echo "Creating state bucket: $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      # Step 6 — Download providers and configure the S3 backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      # Step 7 — Normalize secret inputs and validate email format
      - name: Prepare Terraform variables
        run: |
          ALERT_EMAIL_CLEAN=$(printf '%s' "${{ secrets.ALERT_EMAIL }}" | tr -d '\r\n' | xargs)

          if ! printf '%s' "$ALERT_EMAIL_CLEAN" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "Invalid ALERT_EMAIL secret value."
            echo "Set ALERT_EMAIL to a plain email address (example: you@example.com), no quotes/spaces/newlines."
            exit 1
          fi

          echo "TF_VAR_ami_id=${{ secrets.AMI_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_docker_image=${{ secrets.DOCKER_IMAGE }}" >> "$GITHUB_ENV"
          echo "TF_VAR_mongo_uri=${{ secrets.MONGO_URI }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_bucket_name=${{ secrets.FRONTEND_BUCKET_NAME }}" >> "$GITHUB_ENV"
          echo "TF_VAR_alert_email=$ALERT_EMAIL_CLEAN" >> "$GITHUB_ENV"

          ALB_DNS_NAME_CLEAN=$(printf '%s' "${{ secrets.ALB_DNS_NAME }}" | tr -d '\r\n' | xargs)
          if [ -z "$ALB_DNS_NAME_CLEAN" ]; then
            ALB_DNS_NAME_CLEAN=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?contains(LoadBalancerName, 'starttech-alb')].DNSName | [0]" \
              --output text)
          fi

          if [ -z "$ALB_DNS_NAME_CLEAN" ] || [ "$ALB_DNS_NAME_CLEAN" = "None" ]; then
            echo "WARNING: ALB DNS could not be resolved. CloudFront /api/* routing may not be created."
            echo "Set ALB_DNS_NAME secret to your current ALB DNS to guarantee API routing via CloudFront."
            ALB_DNS_NAME_CLEAN=""
          fi

          echo "TF_VAR_alb_dns_name=$ALB_DNS_NAME_CLEAN" >> "$GITHUB_ENV"

      # Step 8 — Validate that the configuration is syntactically correct
      - name: Terraform Validate
        run: terraform validate

      # Step 9 — Show what Terraform will create/change/destroy
      # This step runs on PRs so reviewers can see changes before merge
      # Variables are passed as TF_VAR_* env vars — avoids file quoting issues
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      # Step 10 — Apply changes (only on push to main, not on PRs)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      # Step 11 — Export key Terraform outputs for downstream use (main only)
      - name: Export Terraform outputs
        id: export_outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          FRONTEND_BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          BACKEND_URL=$(terraform output -raw backend_url)

          echo "frontend_bucket_name=$FRONTEND_BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$CLOUDFRONT_DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Terraform Outputs For starttech-application"
            echo ""
            echo "Set these in starttech-application repository secrets:"
            echo ""
            echo "- S3_BUCKET_NAME = $FRONTEND_BUCKET_NAME"
            echo "- CLOUDFRONT_DISTRIBUTION_ID = $CLOUDFRONT_DISTRIBUTION_ID"
            echo "- REACT_APP_API_URL = $BACKEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"
